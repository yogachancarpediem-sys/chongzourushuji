<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F5F0E6">
  <meta name="format-detection" content="telephone=no">
  <!-- Open Graph / 微信分享 -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="重走《入蜀记》：陆小六的奇幻诗旅">
  <meta property="og:description" content="南宋乾道六年（1170），陆游从故乡山阴出发，赴任夔州通判。出运河、历长江、入三峡，经十五州府，走过一段奇妙入蜀之旅……">
  <meta property="og:image" content="https://yogachancarpediem-sys.github.io/chongzourushuji/assets/share-card.webp">
  <meta property="og:site_name" content="入蜀记">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="重走《入蜀记》：陆小六的奇幻诗旅">
  <meta name="twitter:description" content="南宋乾道六年（1170），陆游从故乡山阴出发，赴任夔州通判。出运河、历长江、入三峡，经十五州府。">
  <meta name="twitter:image" content="https://yogachancarpediem-sys.github.io/chongzourushuji/assets/share-card.webp">
  <!-- 微信内置浏览器兼容 -->
  <script async src="https://res.wx.qq.com/open/js/jweixin-1.6.0.js"></script>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='8' fill='%23C4A35A'/><text x='50' y='68' font-size='60' text-anchor='middle' font-family='serif' fill='%23F5F0E6'>蜀</text></svg>">
  <title>重走《入蜀记》：陆小六的奇幻诗旅</title>
  <link rel="stylesheet" href="css/style.css?v=54">
  <link rel="preconnect" href="https://fonts.loli.net">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&family=Ma+Shan+Zheng&display=swap" rel="stylesheet" onerror="this.remove()">
</head>
<body>
  <link rel="preload" href="https://cdn.bootcdn.net/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" as="script">
  <!-- 背景音乐 -->
  <audio id="bgm" loop preload="none">
    <source src="assets/bgm.ogg" type="audio/ogg">
    <source src="assets/bgm.mp3" type="audio/mpeg">
  </audio>

  <!-- 音量控制 -->
  <button class="bgm-toggle" id="bgm-toggle" onclick="toggleBGM()" title="背景音乐">
    <span class="bgm-icon">🔇</span>
  </button>

  <!-- 环境音控制 -->
  <button class="ambient-toggle" id="ambient-toggle" onclick="toggleAmbient()" title="环境音">
    <span class="ambient-icon">🌿</span>
  </button>

  <!-- ==================== 卷轴开场 ==================== -->
  <section id="scroll-intro" class="screen active">
    <!-- 卷轴循环视频（双通道无缝循环） -->
    <video class="scroll-video scroll-video-a" id="scroll-video-a" autoplay muted playsinline preload="auto">
      <source src="assets/opening-book.mp4" type="video/mp4">
    </video>
    <video class="scroll-video scroll-video-b" id="scroll-video-b" muted playsinline preload="none">
      <source src="assets/opening-book.mp4" type="video/mp4">
    </video>

    <!-- 点击提示 -->
    <div class="scroll-tap-hint" id="scroll-tap-hint">
      <span class="scroll-tap-text">轻触屏幕 · 展开旅程</span>
      <span class="scroll-tap-dot"></span>
    </div>
  </section>

  <!-- ==================== 开场页 ==================== -->
  <section id="opening" class="screen">
    <!-- 开场视频背景 -->
    <video class="opening-video" id="opening-video" muted playsinline preload="metadata"
           poster="assets/scenery/suzhou.webp">
      <source src="assets/opening.mp4" type="video/mp4">
    </video>

    <!-- 视频遮罩，确保文字可读 -->
    <div class="opening-overlay"></div>

    <!-- WebGL 着色器背景 -->
    <canvas id="shader-canvas" class="shader-canvas"></canvas>

    <!-- 轻触启程提示（点击后 BGM 渐入） -->
    <div class="opening-tap-hint" id="opening-tap-hint">
      <span class="tap-hint-text">轻触屏幕 · 启程</span>
      <span class="tap-hint-dot"></span>
    </div>

    <div class="opening-content">
      <!-- 标题区 -->
      <div class="title-group">
        <div class="seal seal-base"><span>入</span><span>蜀</span><span>记</span></div>
        <h1 class="title">重走入蜀记</h1>
        <div class="title-line"></div>
        <p class="subtitle">陆小六的奇幻诗旅</p>
      </div>

      <p class="opening-tagline">
        南宋乾道六年（1170），<br>
        陆游从故乡山阴出发，赴任夔州通判。<br>
        出运河、历长江、入三峡，<br>
        经十五州府，走过一段奇妙入蜀之旅……
      </p>

      <!-- 诗旅路线 · 水墨流线 + 金色小船 -->
      <div class="route-stream" id="route-stream">
        <svg class="stream-svg" viewBox="0 0 510 70" preserveAspectRatio="xMidYMid meet">
          <defs>
            <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="1.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>
          <path id="streamPath"
                d="M16,38 C40,28 54,40 72,34 C100,26 112,40 132,30 C158,38 170,30 192,34 C222,24 236,40 252,28 C282,38 296,30 312,34 C342,26 354,36 372,30 C402,38 422,30 440,33 C462,28 482,36 498,36"
                fill="none" stroke="var(--ink)" stroke-width="0.6" stroke-linecap="round" opacity="0.1"/>
          <path d="M16,38 C40,28 54,40 72,34 C100,26 112,40 132,30 C158,38 170,30 192,34 C222,24 236,40 252,28 C282,38 296,30 312,34 C342,26 354,36 372,30 C402,38 422,30 440,33 C462,28 482,36 498,36"
                fill="none" stroke="var(--ink)" stroke-width="4" stroke-linecap="round" opacity="0.02"/>
          <!-- 金色帆船（JS 控制） -->
          <g id="goldBoat" opacity="0" filter="url(#softGlow)">
            <path d="M-7,1 Q-5,4 0,4 Q5,4 7,1 Q4,0 -4,0 Z" fill="var(--accent-gold)" opacity="0.95"/>
            <line x1="0" y1="0" x2="0" y2="-10" stroke="var(--accent-gold)" stroke-width="0.5" opacity="0.8"/>
            <path d="M0.5,-1 L1,-9 Q5,-5 0.5,-1Z" fill="var(--accent-gold)" opacity="0.7"/>
            <path d="M1,-3 L1,-8 Q3,-5.5 1,-3Z" fill="#E8D48B" opacity="0.3"/>
            <path d="M0,-10 L3,-9.2 L0,-8.5" fill="var(--accent-red)" opacity="0.6"/>
          </g>
          <line id="goldWake" x1="0" y1="0" x2="0" y2="0" stroke="var(--accent-gold)" stroke-width="0.5" stroke-linecap="round" opacity="0"/>
          <circle id="goldHalo" cx="0" cy="0" r="6" fill="var(--accent-gold)" opacity="0"/>
          <!-- 九站圆点 + 站名 -->
          <circle cx="16" cy="38" r="2" fill="var(--ink)" class="sp sp-1" data-station="linan"/>
          <circle cx="72" cy="34" r="2.5" fill="var(--accent-gold)" class="sp sp-2" data-station="shanyin"/>
          <circle cx="132" cy="30" r="2" fill="var(--ink)" class="sp sp-3" data-station="fengqiao"/>
          <circle cx="192" cy="34" r="2" fill="var(--ink)" class="sp sp-4" data-station="jinshan"/>
          <circle cx="252" cy="28" r="2" fill="var(--ink)" class="sp sp-5" data-station="jiankang"/>
          <circle cx="312" cy="34" r="2" fill="var(--ink)" class="sp sp-6" data-station="huangzhou"/>
          <circle cx="372" cy="30" r="2" fill="var(--ink)" class="sp sp-7" data-station="wushan"/>
          <circle cx="440" cy="33" r="2.5" fill="var(--accent-red)" class="sp sp-8" data-station="kuizhou"/>
          <circle cx="498" cy="36" r="2.5" fill="var(--accent-gold)" class="sp sp-9" data-station="shuzhou"/>
          <text x="16" y="56" class="sl sl-1">临安</text>
          <text x="72" y="56" class="sl sl-2">山阴</text>
          <text x="132" y="56" class="sl sl-3">枫桥</text>
          <text x="192" y="56" class="sl sl-4">金山</text>
          <text x="252" y="56" class="sl sl-5">建康</text>
          <text x="312" y="56" class="sl sl-6">黄州</text>
          <text x="372" y="56" class="sl sl-7">巫山</text>
          <text x="440" y="56" class="sl sl-8">夔州</text>
          <text x="498" y="56" class="sl sl-9">蜀州</text>
        </svg>
      </div>

      <!-- 呼吸柔光 -->
      <div class="opening-glow"></div>

      <button class="start-btn" id="start-btn" onclick="startJourney()" style="pointer-events:none">
        <span class="btn-text">踏上诗旅</span>
        <span class="btn-ink"></span>
      </button>
    </div>
  </section>

  <!-- ==================== 主页面 ==================== -->
  <section id="main" class="screen">
    <header class="top-bar">
      <div class="top-bar-left">
        <span class="logo-text" onclick="backToCover()" style="cursor:pointer">入蜀记</span>
      </div>
      <div class="top-bar-center">
        <div class="progress-ring">
          <span class="progress-label">诗心碎片</span>
          <span class="progress-count" id="fragment-count">0 / 0</span>
        </div>
      </div>
      <div class="top-bar-right">
        <button class="nav-btn" onclick="showView('achievements')" title="成就">🏆</button>
        <button class="nav-btn" onclick="showView('quiz')" title="诗词挑战">📝</button>
        <button class="nav-btn" onclick="showView('poetry')" title="诗集">📖</button>
        <button class="nav-btn" onclick="showView('gallery')" title="诗签画廊">🖼️</button>
      </div>
    </header>

    <!-- ===== 地图视图 ===== -->
    <div id="view-map" class="view active">
      <div class="map-container">
        <!-- 视差层 A：远山云雾 -->
        <div class="parallax-layer parallax-mountains" id="parallax-mountains">
          <svg class="mountains-svg" viewBox="0 0 400 600" preserveAspectRatio="none">
            <defs>
              <linearGradient id="mtGrad1" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#C8D8E0" stop-opacity="0.2"/>
                <stop offset="100%" stop-color="#C8D8E0" stop-opacity="0.05"/>
              </linearGradient>
            </defs>
            <path d="M0,200 Q60,140 120,180 Q180,120 240,160 Q300,100 360,150 Q400,130 400,170 L400,600 L0,600 Z" fill="url(#mtGrad1)"/>
            <path d="M0,260 Q80,200 160,240 Q240,180 320,220 Q360,200 400,230 L400,600 L0,600 Z" fill="url(#mtGrad1)" opacity="0.5"/>
            <!-- 云雾 -->
            <ellipse cx="200" cy="180" rx="160" ry="30" fill="#E8EFF4" opacity="0.15"/>
            <ellipse cx="120" cy="220" rx="100" ry="20" fill="#E8EFF4" opacity="0.1"/>
            <ellipse cx="300" cy="160" rx="120" ry="25" fill="#E8EFF4" opacity="0.12"/>
          </svg>
        </div>
        <div class="river-bg">
          <svg class="river-svg" viewBox="0 0 100 600" preserveAspectRatio="none">
            <defs>
              <linearGradient id="riverGrad" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0%" stop-color="#7EB8C9" stop-opacity="0.3"/>
                <stop offset="50%" stop-color="#5B8FA8" stop-opacity="0.5"/>
                <stop offset="100%" stop-color="#3D7A8A" stop-opacity="0.3"/>
              </linearGradient>
            </defs>
            <path d="M50 0 C55 30, 60 60, 48 100 C36 140, 55 180, 50 220 C45 260, 60 300, 52 340 C44 380, 55 420, 50 460 C45 500, 60 540, 50 600"
                  fill="none" stroke="url(#riverGrad)" stroke-width="12" stroke-linecap="round"/>
            <path d="M50 0 C55 30, 60 60, 48 100 C36 140, 55 180, 50 220 C45 260, 60 300, 52 340 C44 380, 55 420, 50 460 C45 500, 60 540, 50 600"
                  fill="none" stroke="#5B8FA8" stroke-width="2" stroke-linecap="round" stroke-dasharray="4 8" opacity="0.6">
              <animate attributeName="stroke-dashoffset" from="0" to="-24" dur="2s" repeatCount="indefinite"/>
            </path>
          </svg>
        </div>
        <div class="stations-list" id="stations-list"></div>
      </div>
      <div class="character-bubble" id="character-bubble">
        <div class="bubble-avatar" id="bubble-avatar-img">
          <img src="assets/characters/liuxiaoliu_wave.webp" alt="陆小六" style="width:100%;height:100%;object-fit:contain;border-radius:50%;">
        </div>
        <div class="bubble-content">
          <div class="bubble-name">陆小六</div>
          <div class="bubble-text" id="bubble-text">点击驿站开始探索吧！</div>
        </div>
      </div>
    </div>

    <!-- ===== 驿站详情视图 ===== -->
    <div id="view-station" class="view">
      <button class="back-btn" onclick="showView('map')">← 返回地图</button>
      <div class="station-detail" id="station-detail"></div>
      <div class="finale-trigger" id="finale-trigger" style="display:none">
        <div class="finale-trigger-divider"></div>
        <p class="finale-trigger-text">九站已通，蜀道在望</p>
        <button class="finale-trigger-btn" onclick="showFinale()">
          <span>继续前行</span>
          <span class="finale-trigger-arrow">→ 抵达蜀州</span>
        </button>
      </div>
    </div>

    <!-- ===== 诗词挑战视图 ===== -->
    <div id="view-quiz" class="view">
      <button class="back-btn" onclick="showView('map')">← 返回地图</button>
      <div class="quiz-container" id="quiz-container"></div>
    </div>

    <!-- ===== 诗集视图 ===== -->
    <div id="view-poetry" class="view">
      <button class="back-btn" onclick="showView('map')">← 返回地图</button>
      <div class="poetry-container" id="poetry-container">
        <h2 class="section-title">诗心共鸣</h2>
        <div class="poetry-list" id="poetry-list"></div>
      </div>
    </div>

    <!-- ===== 诗签画廊视图 ===== -->
    <div id="view-gallery" class="view">
      <button class="back-btn" onclick="showView('map')">← 返回地图</button>
      <div class="gallery-container">
        <h2 class="section-title">诗签画廊</h2>
        <p class="gallery-subtitle">你所收集的诗签，皆在此处</p>
        <div class="gallery-grid" id="gallery-grid"></div>
        <div class="gallery-empty" id="gallery-empty" style="display:none">
          <p>还没有收集任何诗签</p>
          <p class="gallery-empty-hint">探索驿站，生成你的第一张诗签吧</p>
        </div>
      </div>
    </div>

    <!-- ===== 成就视图 ===== -->
    <div id="view-achievements" class="view">
      <button class="back-btn" onclick="showView('map')">← 返回地图</button>
      <div class="achievements-container">
        <h2 class="section-title">诗旅成就</h2>
        <div class="achievements-grid" id="achievements-grid"></div>
      </div>
    </div>

    <!-- ===== 终页 ===== -->
    <div id="view-finale" class="view">
      <div class="finale-container" id="finale-container"></div>
    </div>
  </section>

  <!-- ICP 备案号 -->
  <footer class="site-icp">
    <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">蜀ICP备2026027010号</a>
  </footer>
</body>
<script src="js/data.js?v=31"></script>
<script src="js/shader-bg.js?v=23"></script>
<script src="js/sfx.js?v=1"></script>
<script src="js/tts.js?v=4"></script>
<script src="js/ambient.js?v=6"></script>
<script src="js/idle-events.js?v=2"></script>
<script src="js/app.js?v=63"></script>
  <!-- 分享卡片生成 -->
  <script src="https://cdn.bootcdn.net/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" defer></script>
<script>
  // 开场 shader 由视频结束后延迟启动（见 app.js showContent），避免 WebGL 干扰视频解码
  window.addEventListener('DOMContentLoaded', function() {
    /* 按钮延迟激活：等视频转场完成后再可点击 */
    setTimeout(function() {
      var btn = document.getElementById('start-btn');
      if (btn) btn.style.pointerEvents = 'auto';
    }, 10000);
  });
</script>
</html>
